# VoiceVault 服务端部署（NAS / 树莓派 4B / x86 通用）
# 用法：
#   1. 编辑下方 environment 里的 VAULT_TOKEN（改成你的强令牌）
#   2. docker compose up -d
#   3. 浏览器打开 http://<设备ip>:8080 ，设置里填同一个令牌
#
# ┌ 内存档位速查 ─────────────────────────────────────────────
# │ 2GB 设备：保持默认（tiny 模型），无需任何配置
# │ 4GB 设备：直接改下方对应行——
# │   voicvault:  VAULT_ASR__MODEL 改 small（中文准确率更好）
# │               mem_limit 改 1536m
# │   asr:        mem_limit 改 2048m（small 推理峰值 ~1GB+，
# │               不放宽会被 1024m 护栏反复 OOM kill）
# │               cpus 改 "2.5"（留核给系统/其他应用）
# │   （也可不改文件，用 .env 设 ASR_MEMLIMIT/ASR_CPUS/VAULT_ASR_MODEL 覆盖）
# └───────────────────────────────────────────────────────────
services:
  voicvault:
    # 本地构建（含 arm64）或拉取已发布的 GHCR 镜像
    image: ghcr.io/zeng-qh/voicvault-server:latest
    build:
      context: ./server
      platforms:
        - linux/amd64
        - linux/arm64
    container_name: voicvault
    ports:
      - "8080:8080"
    environment:
      # 访问令牌：直接改这一行（换成你的强随机串），网页端「设置 → 访问令牌」填同一个值
      - VAULT_TOKEN=change-me-please
      - VAULT_DATADIR=/data
      - VAULT_PORT=8080
      - VAULT_BIND=0.0.0.0
      # 转写模型：2GB 设备用 tiny；4GB 推荐改 small（中文准确率明显更好）
      - VAULT_ASR__MODEL=tiny
      # 默认开启实时转写（上传即转）。改 false 则只备份不自动转写
      # 转写时机：Off（关闭，仅手动）/ Realtime（上传即转）/ Idle（闲时转写）
      - VAULT_ASR__ENABLED=true
      - VAULT_ASR__MODE=Realtime
      - VAULT_ASR__IDLESTARTHOUR=22
      - VAULT_ASR__IDLEENDHOUR=7
    # 内存硬上限（防失控护栏，非实际占用）：默认 2GB 小设备保守值。
    # 4GB 设备在 .env 设 VAULT_MEMLIMIT=1536m。
    mem_limit: ${VAULT_MEMLIMIT:-896m}
    volumes:
      - voicvault-data:/data
    restart: unless-stopped
    # 日志轮转：防止长期运行写满 SD 卡（镜像内自带 HEALTHCHECK 探活）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 可选：本地语音转写边车。默认不随 `docker compose up` 启动（省内存），
  # 需要时：docker compose --profile asr up -d
  # 注意：2GB 树莓派必须保持 tiny；4GB 可改 small 并放宽下方内存/CPU。
  asr:
    profiles: ["asr"]
    image: ghcr.io/zeng-qh/voicvault-asr:latest
    build: ./asr
    ports:
      - "8000:8000"
    environment:
      - ASR_DEVICE=cpu
      - ASR_COMPUTE=int8
      # 推理线程数：保守 3（给系统留核）；4GB 四核可放开到 4
      - CT2_NUM_THREADS=3
      - OMP_NUM_THREADS=3
      - MKL_NUM_THREADS=3
    volumes:
      - ./asr-models:/root/.cache  # 缓存 Whisper 模型
    # 2GB 默认 1024m + 1.5 核；4GB 跑 small 时在 .env 设
    # ASR_MEMLIMIT=2048m、ASR_CPUS=2.5（small 推理峰值 ~1GB+，不放宽会被 OOM kill）
    mem_limit: ${ASR_MEMLIMIT:-1024m}
    cpus: "${ASR_CPUS:-1.5}"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  voicvault-data:
