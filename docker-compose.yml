# VoiceVault 服务端部署（NAS / 树莓派 4B / x86 通用）
# 用法：
#   echo "VAULT_TOKEN=你的强令牌" > .env
#   docker compose up -d
services:
  voicvault:
    # 本地构建（含 arm64）或拉取已发布的 GHCR 镜像
    image: ghcr.io/zeng-qh/voicvault-server:latest
    build:
      context: ./server
      platforms:
        - linux/amd64
        - linux/arm64
    container_name: voicvault
    ports:
      - "8080:8080"
    environment:
      - VAULT_TOKEN=${VAULT_TOKEN:-change-me-please}
      - VAULT_DATADIR=/data
      - VAULT_PORT=8080
      - VAULT_BIND=0.0.0.0
      # 树莓派 2GB 默认用 tiny 模型（ASR 开启时）；x86 可改 small / medium
      - VAULT_ASR__MODEL=${VAULT_ASR_MODEL:-tiny}
    # 内存硬上限：2GB Pi 上留足系统与其他服务，避免 OOM。
    # 与镜像内 DOTNET_GCHeapHardLimitPercent=70 配合，GC 堆上限约 600MB。
    mem_limit: 896m
    volumes:
      - voicvault-data:/data
    restart: unless-stopped

  # 可选：本地语音转写边车。默认不随 `docker compose up` 启动（省内存），
  # 需要时：docker compose --profile asr up -d
  # 注意：2GB 树莓派建议保持 tiny 并限制内存/CPU，否则转写时易 OOM。
  asr:
    profiles: ["asr"]
    image: ghcr.io/zeng-qh/voicvault-asr:latest
    build: ./asr
    ports:
      - "8000:8000"
    environment:
      - ASR_DEVICE=cpu
      - ASR_COMPUTE=int8
    volumes:
      - ./asr-models:/root/.cache  # 缓存 Whisper 模型
    mem_limit: 1024m
    cpus: "1.5"
    restart: unless-stopped

volumes:
  voicvault-data:
