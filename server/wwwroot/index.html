<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>录音保险箱 · VoiceVault</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🎙️</span>
      <div>
        <h1>录音保险箱</h1>
        <small>VoiceVault · 本地私有备份</small>
      </div>
    </div>
    <div class="actions">
      <input id="search" type="search" placeholder="搜索文件名 / 标题…" />
      <button id="manageBtn" title="多选管理">☑️</button>
      <button id="tBtn" title="转写管理">🎯</button>
      <button id="uploadBtn" title="上传录音">⬆️</button>
      <button id="refresh" title="刷新">🔄</button>
      <button id="settingsBtn" title="设置">⚙️</button>
    </div>
  </header>

  <!-- 多选模式浮动操作栏 -->
  <div id="batchBar" class="batch-bar" hidden>
    <span id="batchCount">已选 0 条</span>
    <button id="batchAll">全选</button>
    <button id="batchExport" title="打包下载选中的录音">📦 导出ZIP</button>
    <button id="batchDelete" class="danger">🗑 删除</button>
    <button id="batchCancel">取消</button>
  </div>

  <main>
    <div class="filters">
      <select id="contactFilter" title="按来源分类（电话号码 / 微信联系人）">
        <option value="">全部来源</option>
      </select>
      <select id="monthFilter" title="按录音月份筛选">
        <option value="">全部时间</option>
      </select>
      <button id="clearFilters" title="清空筛选" hidden>✕ 清除筛选</button>
    </div>
    <div id="status" class="status"></div>
    <div id="timeline" class="timeline"></div>
  </main>

  <footer class="player" id="playerBar" hidden>
    <div class="nowplaying" id="nowPlaying">未在播放</div>
    <audio id="audio" controls preload="metadata"></audio>
  </footer>

  <!-- 上传弹层：拖拽/多选，4MB 分片断点续传 -->
  <div id="uploadModal" class="modal" hidden>
    <div class="modal-card">
      <h2>上传录音</h2>
      <div id="dropZone" class="drop-zone">
        <div class="drop-hint">
          拖拽音频文件到此处，或点击选择<br />
          <small>支持多选 · 断网 / 中断后自动从断点续传，无需重传整个文件</small>
        </div>
        <input id="uploadInput" type="file" multiple hidden
               accept="audio/*,.m4a,.mp3,.wav,.amr,.aac,.ogg,.oga,.flac,.opus,.webm,.3gp" />
      </div>
      <div id="uploadQueue" class="upload-queue"></div>
      <div class="modal-actions">
        <button id="closeUpload">关闭</button>
      </div>
      <!-- 全部上传完成：对钩描边动画覆盖层（播完自动关闭弹窗） -->
      <div id="uploadDone" class="upload-done" hidden>
        <svg viewBox="0 0 52 52" class="done-check" aria-hidden="true">
          <circle class="done-circle" cx="26" cy="26" r="24" fill="none"/>
          <path class="done-tick" fill="none" d="M14 27l8 8 16-16"/>
        </svg>
        <div class="done-text">上传完成</div>
      </div>
    </div>
  </div>

  <!-- 转写管理：待转写列表 / 分组勾选 / 批量转写 / 「不转写」标记 / 预计与实际耗时 -->
  <div id="tModal" class="modal" hidden>
    <div class="modal-card t-card">
      <div class="t-head">
        <h2>转写管理</h2>
        <button id="tClose" title="关闭">✕</button>
      </div>
      <div id="tStats" class="t-stats">加载中…</div>
      <div class="t-toolbar">
        <input id="tFilter" type="search" placeholder="过滤文件名 / 标题…" />
        <label class="t-regex" title="把输入内容按正则表达式匹配">
          <input id="tRegexChk" type="checkbox" /> .*
        </label>
        <select id="tView" title="按转写状态筛选">
          <option value="todo" selected>待转写</option>
          <option value="pending">转写中</option>
          <option value="done">已转写</option>
          <option value="skip">不转写</option>
          <option value="all">全部</option>
        </select>
      </div>
      <div class="t-actions">
        <button id="tEnqueueAll" class="primary">⚡ 一键转写全部</button>
        <span id="tFilterHint" class="t-hint"></span>
      </div>
      <div id="tList" class="t-list"></div>
      <div id="tBatchBar" class="t-batch" hidden>
        <span id="tBatchInfo">已选 0 条</span>
        <button id="tBatchAll" title="勾选当前显示的全部条目">全选</button>
        <button id="tBatchEnqueue" class="primary">⚡ 转写所选</button>
        <button id="tBatchSkip" title="标记后批量转写自动跳过">🚫 不转写</button>
        <button id="tBatchUnskip" title="取消「不转写」标记">↩ 取消标记</button>
        <button id="tBatchCancel">取消</button>
      </div>
    </div>
  </div>

  <!-- 设置弹窗 -->
  <div id="settingsModal" class="modal" hidden>
    <div class="modal-card">
      <h2>设置</h2>
      <div id="srvStatus" class="srv-status">服务器状态加载中…</div>
      <label>服务器地址
        <input id="cfgServer" type="text" placeholder="http://192.168.1.10:8080" />
      </label>
      <label>访问令牌 (Token)
        <input id="cfgToken" type="password" placeholder="与服务端 VAULT_TOKEN 一致" />
      </label>
      <hr />
      <h3>本地转写 (ASR)</h3>
      <label class="row">
        <input id="cfgAsrEnabled" type="checkbox" /> 启用语音转文字
      </label>
      <label>转写时机
        <select id="cfgAsrMode">
          <option value="off">关闭（仅手动转写）</option>
          <option value="realtime" selected>实时转写（上传后立即）</option>
          <option value="idle">闲时转写（设定空闲时段）</option>
        </select>
      </label>
      <div id="idleWindowBox" class="idle-window" hidden>
        <div class="idle-hint">每天仅在以下空闲时段内转写，其余时间只备份不转写（按服务器本地时区）。</div>
        <div class="idle-range">
          <label>起始 <input id="cfgAsrIdleStart" type="number" min="0" max="23" step="1" value="22" /> 时</label>
          <span class="idle-sep">→</span>
          <label>结束 <input id="cfgAsrIdleEnd" type="number" min="0" max="23" step="1" value="7" /> 时</label>
        </div>
        <div id="idlePreview" class="idle-preview"></div>
      </div>
      <label>ASR 边车地址
        <input id="cfgAsrEndpoint" type="text" placeholder="http://localhost:8000" />
      </label>
      <label>模型规模
        <select id="cfgAsrModel">
          <option value="tiny">tiny（最快）</option>
          <option value="base">base</option>
          <option value="small" selected>small（推荐）</option>
          <option value="medium">medium（更准）</option>
        </select>
      </label>
      <label class="row">
        <input id="cfgAsrDiarize" type="checkbox" /> 说话人分段
      </label>
      <hr />
      <h3>保留策略</h3>
      <div class="idle-hint">超期或超出容量上限时，自动从最旧的录音开始清理（两项都填 0 表示永久保留全部）。</div>
      <div class="idle-range">
        <label>保留 <input id="cfgRetDays" type="number" min="0" max="36500" step="1" value="0" /> 天</label>
        <span class="idle-sep">·</span>
        <label>上限 <input id="cfgRetGb" type="number" min="0" step="1" value="0" /> GB</label>
      </div>
      <label>每页条数
        <select id="cfgPageSize">
          <option value="20">20 条 / 页</option>
          <option value="50">50 条 / 页</option>
          <option value="100">100 条 / 页</option>
        </select>
      </label>
      <div class="modal-actions">
        <button id="transcribeAllBtn">转写全部未处理</button>
        <button id="testConn">测试连接</button>
        <button id="saveSettings" class="primary">保存</button>
      </div>
    </div>
  </div>

  <!-- 录音详情：左侧播放 / 右侧文字稿 -->
  <div id="detailModal" class="modal" hidden>
    <div class="detail">
      <div class="detail-head">
        <div class="detail-title">
          <h2 id="dTitle">—</h2>
          <div id="dMeta" class="d-meta"></div>
        </div>
        <button id="dClose" title="关闭">✕</button>
      </div>
      <div class="detail-body">
        <section class="d-left">
          <div class="d-player-card">
            <button id="dPlay" class="d-playbtn" title="播放/暂停">▶</button>
            <div class="d-player-info">
              <div id="dState" class="d-state">就绪</div>
              <audio id="dAudio" controls preload="metadata"></audio>
            </div>
          </div>
          <div class="d-edit-card">
            <div class="d-edit-row">
              <input id="dEditTitle" type="text" placeholder="标题（可搜索）" />
              <button id="dSaveMeta" title="保存标题与备注">💾</button>
            </div>
            <textarea id="dNoteEdit" placeholder="备注（参与关键词搜索，如：参会人、主题…）" rows="2"></textarea>
          </div>
          <div id="dInfo" class="d-info-card"></div>
          <a id="dDownload" class="d-download" download>⬇ 下载原文件</a>
          <button id="dDelete" class="d-delete">🗑 删除录音</button>
        </section>
        <section class="d-right">
          <div class="d-trans-head">
            <h3>文字稿</h3>
            <div class="d-trans-actions">
              <button id="dExportTxt" title="导出带时间戳纯文本">导出TXT</button>
              <button id="dExportSrt" title="导出标准字幕文件">导出SRT</button>
              <button id="dCopy">复制全文</button>
              <button id="dTranscribe">立即转写</button>
            </div>
          </div>
          <div id="dTranscript" class="d-transcript"></div>
        </section>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
